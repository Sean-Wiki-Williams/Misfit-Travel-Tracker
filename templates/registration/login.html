<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in — Dad's Flight Tracker</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-7380688007699870"
     crossorigin="anonymous"></script>
  <style>
    :root{--bs-primary:#002b5c;--bs-primary-rgb:0,43,92;--bs-link-color:#002b5c}
    body{margin:0;background:#f2f5f8;color:#1a1a1a;font:16px system-ui,sans-serif}
    main{max-width:420px;margin:10vh auto;padding:28px;background:#fff;border-radius:12px;box-shadow:0 8px 24px #002b5c18}
    h1{margin-top:0;color:#002b5c;font-size:24px}
    label{display:block;margin:16px 0 6px;font-weight:600}
    input{box-sizing:border-box;width:100%;padding:11px;border:1px solid #aab4bf;border-radius:6px;font:inherit}
    button{width:100%;margin-top:22px;padding:12px;border:0;border-radius:6px;background:#002b5c;color:#fff;font:inherit;font-weight:700;cursor:pointer}
    a{color:#002b5c}
    .errors{padding:10px;border-radius:6px;background:#fff0f0;color:#8a1020}
  </style>
</head>
<body>
  <main>
    <h1>Dad's Flight Tracker</h1>
    <p>Sign in to view your private flight schedule.</p>
    {% if form.errors %}<p class="errors">Email or password is incorrect.</p>{% endif %}
    <form method="post">
      {% csrf_token %}
      <label for="{{ form.username.id_for_label }}">Email</label>
      <input id="{{ form.username.id_for_label }}" name="{{ form.username.html_name }}" type="email" class="form-control" autocomplete="email" maxlength="320" required autofocus>
      <label for="{{ form.password.id_for_label }}">Password</label>
      <input id="{{ form.password.id_for_label }}" name="{{ form.password.html_name }}" type="password" class="form-control" autocomplete="current-password" required>
      <button class="btn btn-primary" type="submit">Sign in</button>
    </form>
    <p>New here? <a href="{% url 'register' %}">Create an account</a>.</p>
  </main>
</body>
</html>
